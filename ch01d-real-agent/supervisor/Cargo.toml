[package]
name = "supervisor"
version = "0.1.0"
edition = "2024"
description = "Guest level 0 (EL1): answers, refuses or forwards every system call of the agent"

[profile.release]
panic = "abort"
opt-level = "s"
overflow-checks = true # an arithmetic wrap-around stops the sandbox instead of silently continuing

[profile.dev]
panic = "abort"
